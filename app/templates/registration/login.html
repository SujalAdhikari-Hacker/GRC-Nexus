{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top: 8vh;">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock" style="font-size: 2.5rem; color: #1e293b;"></i>
                    <h4 class="mt-2 mb-0">GRC Platform</h4>
                    <small class="text-muted">Sign in to continue</small>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger small py-2">
                        Invalid username or password.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-dark w-100">Sign In</button>
                </form>

                <hr class="my-4">
                <div class="text-muted small text-center">
                    Demo accounts (password: <code>demo1234</code>):<br>
                    <code>it_hod</code> · <code>fin_hod</code> · <code>hr_hod</code> · <code>admin</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
