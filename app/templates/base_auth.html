{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sign in{% endblock %} · GRC Nexus</title>
    <meta name="description" content="{% block meta_description %}Sign in to GRC Nexus — the governance, risk and compliance platform that connects assets, risks, controls, policies, audits and incidents in one auditable system of record.{% endblock %}">
    <meta name="theme-color" content="#0B1220">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
    <script>
        (function(){
            try {
                // Priority 1: user's DB preference from settings page
                var userPref = '{{ user_theme_pref|default:"system" }}';
                // Priority 2: localStorage (from manual toggle)
                var lsPref = localStorage.getItem('grcnexus-theme');
                // Priority 3: system default
                var sysPref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

                var theme;
                if (userPref === 'light' || userPref === 'dark') {
                    theme = userPref;
                    // Keep localStorage in sync so the toggle button still works
                    localStorage.setItem('grcnexus-theme', theme);
                } else if (lsPref === 'light' || lsPref === 'dark') {
                    theme = lsPref;
                } else {
                    theme = sysPref;
                }

                document.documentElement.setAttribute('data-bs-theme', theme);
            } catch(e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/brand.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/theme.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
