{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not found · GRC Nexus</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <script>
        (function(){
            try {
                var t = localStorage.getItem('grcnexus-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch(e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/brand.css' %}" rel="stylesheet">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">

<div style="max-width:520px; text-align:center;">
    <img src="{% static 'img/logo.png' %}" style="width:48px; height:48px; margin-bottom:24px;" alt="">
    <div style="font-size:72px; font-weight:700; letter-spacing:-0.04em; line-height:1; color:var(--text);">404</div>
    <h1 style="font-size:22px; font-weight:600; margin:16px 0 8px;">Page not found</h1>
    <p style="color:var(--text-muted); font-size:14px; line-height:1.6; margin-bottom:28px;">
        The page you're looking for doesn't exist, has been moved, or you don't have access to it.
    </p>
    <div style="display:flex; gap:10px; justify-content:center;">
        <a href="/" class="btn btn-dark">Back to dashboard</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Go back</a>
    </div>
    <div style="margin-top:40px; font-size:12px; color:var(--text-faint);">
        GRC Nexus · Governance, Risk &amp; Compliance Platform
    </div>
</div>

</body>
</html>
