{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server error · GRC Nexus</title>
    <meta name="description" content="An unexpected error occurred in GRC Nexus.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0B1220">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
    <script nonce="{{ csp_nonce }}">
        (function(){
            try {
                var t = localStorage.getItem('grcnexus-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch(e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/brand.css' %}" rel="stylesheet">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">

<div style="max-width:520px; text-align:center;">
    <img src="{% static 'img/logo.svg' %}" style="width:48px; height:48px; margin-bottom:24px;" alt="">
    <div style="font-size:72px; font-weight:700; letter-spacing:-0.04em; line-height:1; color:var(--danger);">500</div>
    <h1 style="font-size:22px; font-weight:600; margin:16px 0 8px;">Something went wrong</h1>
    <p style="color:var(--text-muted); font-size:14px; line-height:1.6; margin-bottom:28px;">
        An unexpected error occurred. Our team has been notified. Please try again in a moment.
    </p>
    <div style="display:flex; gap:10px; justify-content:center;">
        <a href="{% url 'core:dashboard' %}" class="btn btn-dark">Back to dashboard</a>
        <a href="{{ request_path|default:'/' }}" class="btn btn-outline-secondary">Reload page</a>
    </div>
    <div style="margin-top:40px; font-size:12px; color:var(--text-faint);">
        GRC Nexus · Governance, Risk &amp; Compliance Platform
    </div>
</div>

</body>
</html>
