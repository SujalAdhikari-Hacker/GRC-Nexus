{% load static %}
<div class="report-seal">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="95" fill="none" stroke="#00A8E8" stroke-width="1.5" opacity="0.5"/>
        <circle cx="100" cy="100" r="88" fill="none" stroke="#00A8E8" stroke-width="0.5" opacity="0.3"/>

        <path id="seal-top-arc" d="M 25,100 A 75,75 0 0 1 175,100" fill="none"/>
        <text font-family="Helvetica, Arial, sans-serif" fill="#00A8E8" font-weight="700"
              font-size="13" letter-spacing="3">
            <textPath href="#seal-top-arc" startOffset="50%" text-anchor="middle">
                GRC NEXUS
            </textPath>
        </text>

        <path id="seal-bottom-arc" d="M 175,100 A 75,75 0 0 1 25,100" fill="none"/>
        <text font-family="Helvetica, Arial, sans-serif" fill="#00A8E8" font-weight="700"
              font-size="11" letter-spacing="4" opacity="0.9">
            <textPath href="#seal-bottom-arc" startOffset="50%" text-anchor="middle">
                {{ classification|default:"CONFIDENTIAL" }}
            </textPath>
        </text>

        <image x="72" y="72" width="56" height="56" href="{% static 'img/logo.png' %}"/>

        <path d="M 100,20 L 104,25 L 100,30 L 96,25 Z" fill="#00A8E8"/>
        <path d="M 100,170 L 104,175 L 100,180 L 96,175 Z" fill="#00A8E8" opacity="0.6"/>
    </svg>
</div>
