<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>{{ title }}</title>
<style>
body { font-family: Helvetica, Arial, sans-serif; font-size: 9pt; color: #111827; margin: 0; }
h1 { color: #0B1220; font-size: 14pt; margin: 8px 0 0 0; }
.header { border-bottom: 3px solid #F59E0B; padding-bottom: 10px; margin-bottom: 16px; }
.brand-name { font-size: 16pt; font-weight: 700; color: #0B1220; }
.meta { font-size: 9pt; color: #6B7280; text-align: right; float: right; }
table { width: 100%; border-collapse: collapse; font-size: 8.5pt; margin-top: 14px; }
thead { background: #0B1220; color: white; }
thead th { text-align: left; padding: 6px 8px; font-size: 8pt; text-transform: uppercase; }
tbody td { padding: 5px 8px; border: 1px solid #E5E7EB; }
tbody tr:nth-child(even) { background: #FAFBFC; }
</style>
</head>
<body>
<div class="header">
    <div class="brand-name">Aegis</div>
    <h1>{{ title }}</h1>
    <div class="meta">Generated {{ generated_at|date:"Y-m-d H:i" }}</div>
</div>
{% block content %}{% endblock %}
</body>
</html>
