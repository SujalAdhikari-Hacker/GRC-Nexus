<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="GRC Nexus">
  <defs>
    <linearGradient id="gnBg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#131F38"/>
      <stop offset="1" stop-color="#080E1C"/>
    </linearGradient>
    <linearGradient id="gnN" gradientUnits="userSpaceOnUse" x1="60" y1="36" x2="196" y2="220">
      <stop offset="0" stop-color="#8AD8FF"/>
      <stop offset="0.40" stop-color="#2E90FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gnN2" gradientUnits="userSpaceOnUse" x1="144" y1="36" x2="196" y2="220">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#0A3AA0"/>
    </linearGradient>
    <clipPath id="gnLeftHalf">
      <rect x="-152" y="-82" width="152" height="164"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#gnBg)"/>

  <!-- orbit, rear pass (thicker: legible at 16px) -->
  <g transform="translate(128 126) rotate(-18)">
    <ellipse rx="106" ry="41" fill="none" stroke="#E8F4FF" stroke-width="8"/>
  </g>

  <!-- monogram N -->
  <g transform="translate(128 128) skewX(-12) translate(-128 -128)" stroke-linejoin="round">
    <polygon points="74,44 108,44 108,212 74,212" fill="url(#gnN)" stroke="url(#gnN)" stroke-width="12"/>
    <polygon points="100,44 130,44 188,212 158,212" fill="url(#gnN)" stroke="url(#gnN)" stroke-width="12"/>
    <polygon points="150,44 184,44 184,212 150,212" fill="url(#gnN2)" stroke="url(#gnN2)" stroke-width="12"/>
  </g>

  <!-- orbit, front pass (left half only) -->
  <g transform="translate(128 126) rotate(-18)" clip-path="url(#gnLeftHalf)">
    <ellipse rx="106" ry="41" fill="none" stroke="#E8F4FF" stroke-width="8"/>
  </g>
  <g transform="translate(128 126) rotate(-18)">
    <circle cx="-102" cy="12" r="11" fill="#FFFFFF"/>
  </g>
</svg>
